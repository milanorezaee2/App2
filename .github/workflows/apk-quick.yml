name: Publish German-audio APK

# Builds exactly one installable APK for the current work branch and publishes it
# as a GitHub release, so it can be downloaded without any extra tooling.
on:
  push:
    branches:
      - arena/76e3f058-app2
    # Docs and workflow-only commits do not change the app; rebuilding the APK
    # for them would publish an identical release and waste ten minutes of CI.
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/**'

permissions:
  contents: write

concurrency:
  group: apk-quick-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Load public Supabase settings
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('config/supabase.public.json', 'utf8'));
          const url = String(config.EXPO_PUBLIC_SUPABASE_URL || '').trim();
          const key = String(config.EXPO_PUBLIC_SUPABASE_ANON_KEY || '').trim();
          if (!url.startsWith('https://')) throw new Error('Public Supabase URL missing.');
          if (!key || key.startsWith('sb_secret_')) throw new Error('Public Supabase key missing.');
          fs.appendFileSync(process.env.GITHUB_ENV,
            `EXPO_PUBLIC_SUPABASE_URL=${url}\nEXPO_PUBLIC_SUPABASE_ANON_KEY=${key}\n`);
          NODE

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [[ ! -d "$SDK_ROOT/platforms/android-36" || ! -d "$SDK_ROOT/build-tools/36.0.0" || ! -d "$SDK_ROOT/ndk/27.1.12297006" ]]; then
            test -n "$SDKMANAGER"
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
            rm -f "$SDK_ROOT/.knownPackages" 2>/dev/null || true
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
          fi

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify the APK contains the JS bundle and the German audio
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          apk = 'android/app/build/outputs/apk/release/app-release.apk'
          with ZipFile(apk) as archive:
              names = archive.namelist()
          assert 'AndroidManifest.xml' in names, 'missing manifest'
          assert any(n.endswith('classes.dex') for n in names), 'missing dex'
          assert 'assets/index.android.bundle' in names, 'missing standalone JS bundle'
          clips = [n for n in names if n.endswith('.mp3')]
          assert len(clips) >= 190, f'only {len(clips)} German clips in the APK'
          print(f'APK verified: {len(clips)} German clips bundled, standalone JS present.')
          PY
          cp android/app/build/outputs/apk/release/app-release.apk "Milo-Deutsch-${{ github.run_number }}.apk"
          ls -lh "Milo-Deutsch-${{ github.run_number }}.apk"

      - name: Publish the APK as a GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-deutsch-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: "Milo Deutsch APK #${{ github.run_number }}"
          body: |
            نصب‌شدنی روی اندروید (سایدلود). صداهای آلمانی همهٔ ۹۵ درس داخل خود APK هستند،
            پس بخش آلمانی بدون نصب زبان و بدون اینترنت هم درست خوانده می‌شود.
            برای نصب: فایل APK را دانلود کنید و «نصب از منابع نامشخص» را اجازه دهید.
          prerelease: true
          files: Milo-Deutsch-${{ github.run_number }}.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
