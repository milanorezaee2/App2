name: Build all three APKs

# Builds the three installable Android packages from this branch and publishes
# them in one GitHub release:
#   MiloMultilang.apk        learner (opens straight into the courses)
#   MiloMultilang-Login.apk  learner with the login/registration screen
#   MiloAdmin.apk            private management panel
on:
  push:
    branches:
      - arena/76e3f058-app2
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/**'

permissions:
  contents: write

concurrency:
  group: apk-all-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Load public Supabase settings
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('config/supabase.public.json', 'utf8'));
          const url = String(config.EXPO_PUBLIC_SUPABASE_URL || '').trim();
          const key = String(config.EXPO_PUBLIC_SUPABASE_ANON_KEY || '').trim();
          if (!url.startsWith('https://')) throw new Error('Public Supabase URL missing.');
          if (!key || key.startsWith('sb_secret_')) throw new Error('Public Supabase key missing.');
          fs.appendFileSync(process.env.GITHUB_ENV,
            `EXPO_PUBLIC_SUPABASE_URL=${url}\nEXPO_PUBLIC_SUPABASE_ANON_KEY=${key}\n`);
          NODE

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [[ ! -d "$SDK_ROOT/platforms/android-36" || ! -d "$SDK_ROOT/build-tools/36.0.0" || ! -d "$SDK_ROOT/ndk/27.1.12297006" ]]; then
            test -n "$SDKMANAGER"
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
            rm -f "$SDK_ROOT/.knownPackages" 2>/dev/null || true
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
          fi

      - name: Build learner APK
        shell: bash
        run: |
          rm -rf android
          npx expo prebuild --platform android --no-install
          (cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a)
          cp android/app/build/outputs/apk/release/app-release.apk MiloMultilang.apk

      - name: Build learner login APK
        shell: bash
        env:
          EXPO_PUBLIC_LEARNER_LOGIN: "true"
        run: |
          rm -rf android
          EXPO_PUBLIC_LEARNER_LOGIN=true npx expo prebuild --platform android --no-install
          (cd android && chmod +x gradlew && EXPO_PUBLIC_LEARNER_LOGIN=true ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a)
          cp android/app/build/outputs/apk/release/app-release.apk MiloMultilang-Login.apk

      - name: Build management APK
        shell: bash
        env:
          MILO_ADMIN_APP: "true"
          EXPO_PUBLIC_MILO_ADMIN_APP: "true"
          EXPO_PUBLIC_ENABLE_EDUCATION_ADMIN: "true"
        run: |
          rm -rf android
          MILO_ADMIN_APP=true EXPO_PUBLIC_MILO_ADMIN_APP=true EXPO_PUBLIC_ENABLE_EDUCATION_ADMIN=true \
            npx expo prebuild --platform android --no-install
          (cd android && chmod +x gradlew) && (cd android && MILO_ADMIN_APP=true EXPO_PUBLIC_MILO_ADMIN_APP=true EXPO_PUBLIC_ENABLE_EDUCATION_ADMIN=true ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a)
          cp android/app/build/outputs/apk/release/app-release.apk MiloAdmin.apk

      - name: Verify all three APKs
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from collections import Counter, defaultdict
          from zipfile import ZipFile
          expected = ['MiloMultilang.apk', 'MiloMultilang-Login.apk', 'MiloAdmin.apk']
          LIMIT = 175 * 1024 * 1024  # 140-150 MB is the goal; fail early if bloat returns
          for name in expected:
              with ZipFile(name) as archive:
                  entries = archive.namelist()
                  infos = archive.infolist()
              abis = Counter(e.split('/')[1] for e in entries if e.startswith('lib/') and e.count('/') >= 2)
              assert 'AndroidManifest.xml' in entries, f'{name}: missing manifest'
              assert any(e.endswith('classes.dex') for e in entries), f'{name}: missing dex'
              assert 'assets/index.android.bundle' in entries, f'{name}: needs Metro, not standalone'
              clips = [e for e in entries if e.endswith('.mp3')]
              # 190 German clips (one narrator) + 138 Russian clips must be inside.
              assert len(clips) >= 328, f'{name}: only {len(clips)} language clips bundled (328 expected)'
              assert abis.get('arm64-v8a'), f'{name}: no arm64-v8a native libraries'
              # Exactly one CPU architecture: anything else is dead weight that
              # used to add ~50 MB to every download.
              extra = sorted(set(abis) - {'arm64-v8a'})
              assert not extra, f'{name}: unwanted CPU architectures inside: {extra}'
              # Same breakdown printed for the learner build so the log explains the size.
              if name == 'MiloMultilang.apk':
                  groups = defaultdict(int)
                  for info in infos:
                      if info.is_dir():
                          continue
                      path = info.filename
                      if path.startswith('lib/'):
                          key = 'native libraries (lib/arm64-v8a)'
                      elif path.startswith('res/raw/') and path.endswith('.mp3'):
                          key = 'lesson audio (res/raw mp3)'
                      elif path.startswith('res/'):
                          key = 'res/ (icons, fonts, splash)'
                      elif path.startswith('assets/'):
                          key = 'assets/ (JS bundle)'
                      elif path.endswith('.dex'):
                          key = 'dex (app code)'
                      else:
                          key = path.split('/')[0]
                      groups[key] += info.file_size
                  for key, value in sorted(groups.items(), key=lambda item: -item[1])[:10]:
                      print(f'  {value / 1024 / 1024:7.1f} MB  {key}')
              size = os.path.getsize(name)
              print(f'{name}: {size / 1024 / 1024:.0f} MB, {len(clips)} language clips, native ABIs {dict(abis)}')
              assert size < LIMIT, f'{name}: {size / 1024 / 1024:.0f} MB is over the {LIMIT // 1024 // 1024} MB budget'
          PY
          ls -lh MiloMultilang.apk MiloMultilang-Login.apk MiloAdmin.apk

      - name: Publish the three APKs as a GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: milo-apks-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: "Milo APK set #${{ github.run_number }}"
          body: |
            سه فایل نصب‌شدنی اندروید:

            - **MiloMultilang.apk** — نسخهٔ زبان‌آموز (بدون صفحهٔ ورود)
            - **MiloMultilang-Login.apk** — نسخهٔ زبان‌آموز با صفحهٔ ثبت‌نام/ورود
            - **MiloAdmin.apk** — پنل مدیریت خصوصی

            هر سه شامل صداهای آمادهٔ داخل اپ هستند و بدون اینترنت کار می‌کنند:

            - **آلمانی:** گویندهٔ زن عصبی «کرستین» (۱۹۰ کلیپ) برای هر ۹۵ درس و واژه‌ها.
            - **روسی:** گویندهٔ زن عصبی «ایرینا» (۱۳۸ کلیپ) برای هر ۶۹ درس و واژه‌ها.

            این نسخه فقط برای گوشی‌های **arm64** (همهٔ گوشی‌های اندروید امروزی) ساخته شده و
            کتابخانه‌های سه معماری دیگر داخل فایل نیست؛ همین باعث کوچک‌شدن فایل شده است.
            نصب: فایل را دانلود کنید و «نصب از منابع نامشخص» را برای مرورگر اجازه دهید.
          prerelease: true
          files: |
            MiloMultilang.apk
            MiloMultilang-Login.apk
            MiloAdmin.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Milo-apks-${{ github.run_number }}
          path: |
            MiloMultilang.apk
            MiloMultilang-Login.apk
            MiloAdmin.apk
          if-no-files-found: error
          retention-days: 7
