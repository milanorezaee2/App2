name: APK size report

# Diagnostic only: builds the learner APK once and commits a breakdown of what is
# actually inside it (audio, native libraries per ABI, dex, resources, assets) to
# docs/APK-SIZE-REPORT.txt. The main workflow ignores docs/**, so the commit this
# makes cannot start another build.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-size-report
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Load public Supabase settings
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('config/supabase.public.json', 'utf8'));
          const url = String(config.EXPO_PUBLIC_SUPABASE_URL || '').trim();
          const key = String(config.EXPO_PUBLIC_SUPABASE_ANON_KEY || '').trim();
          if (!url.startsWith('https://')) throw new Error('Public Supabase URL missing.');
          if (!key || key.startsWith('sb_secret_')) throw new Error('Public Supabase key missing.');
          fs.appendFileSync(process.env.GITHUB_ENV,
            `EXPO_PUBLIC_SUPABASE_URL=${url}\nEXPO_PUBLIC_SUPABASE_ANON_KEY=${key}\n`);
          NODE

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [[ ! -d "$SDK_ROOT/platforms/android-36" || ! -d "$SDK_ROOT/build-tools/36.0.0" || ! -d "$SDK_ROOT/ndk/27.1.12297006" ]]; then
            test -n "$SDKMANAGER"
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
            rm -f "$SDK_ROOT/.knownPackages" 2>/dev/null || true
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
          fi

      - name: Build learner APK (arm64 only)
        shell: bash
        run: |
          rm -rf android
          npx expo prebuild --platform android --no-install
          (cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a)
          cp android/app/build/outputs/apk/release/app-release.apk MiloMultilang.apk

      - name: Write the size breakdown
        shell: bash
        run: |
          python3 - <<'PY' > docs/APK-SIZE-REPORT.txt
          import os
          from collections import Counter, defaultdict
          from zipfile import ZipFile

          name = 'MiloMultilang.apk'
          total = os.path.getsize(name)
          by_group = defaultdict(int)
          by_ext = defaultdict(int)
          files = 0
          with ZipFile(name) as archive:
              for info in archive.infolist():
                  if info.is_dir():
                      continue
                  files += 1
                  path = info.filename
                  size = info.file_size
                  if path.startswith('lib/') and path.count('/') >= 2:
                      group = 'lib/' + path.split('/')[1]
                  elif path.startswith('assets/'):
                      group = 'assets/'
                  elif path.startswith('res/'):
                      group = 'res/'
                  elif path.endswith('.dex'):
                      group = 'dex'
                  else:
                      group = path.split('/')[0] if '/' in path else path
                  by_group[group] += size
                  ext = os.path.splitext(path)[1].lower() or '(none)'
                  by_ext[ext] += size

          print('APK size breakdown (uncompressed entry sizes)')
          print(f'file: {name}')
          print(f'total on disk: {total / 1024 / 1024:.1f} MB')
          print(f'entries: {files}')
          print()
          print('by group:')
          for group, size in sorted(by_group.items(), key=lambda item: -item[1])[:25]:
              print(f'  {size / 1024 / 1024:8.1f} MB  {group}')
          print()
          print('by extension:')
          for ext, size in sorted(by_ext.items(), key=lambda item: -item[1])[:12]:
              print(f'  {size / 1024 / 1024:8.1f} MB  {ext}')
          print()
          with ZipFile(name) as archive:
              entries = archive.namelist()
          mp3 = [e for e in entries if e.endswith('.mp3')]
          dup = [e for e in entries if e.startswith('audio/')]
          print(f'mp3 entries: {len(mp3)} ({sum(i.file_size for i in ZipFile(name).infolist() if i.filename.endswith(".mp3")) / 1024 / 1024:.1f} MB)')
          print(f'entries under audio/ (the public/ copy): {len(dup)}')
          print(f'assets/index.android.bundle: {"assets/index.android.bundle" in entries}')
          abis = Counter(e.split("/")[1] for e in entries if e.startswith("lib/") and e.count("/") >= 2)
          print(f'native ABI folders: {dict(abis)}')
          print()
          print('largest 25 entries:')
          with ZipFile(name) as archive:
              for info in sorted(archive.infolist(), key=lambda i: -i.file_size)[:25]:
                  print(f'  {info.file_size / 1024 / 1024:8.2f} MB  {info.filename}')
          PY
          cat docs/APK-SIZE-REPORT.txt

      - name: Commit the report
        shell: bash
        run: |
          git config user.name "Arena Agent"
          git config user.email "agent@arena.ai"
          git add docs/APK-SIZE-REPORT.txt
          git commit -m "CI: what is inside the APK (size breakdown)" || exit 0
          git push
