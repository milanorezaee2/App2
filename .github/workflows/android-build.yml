name: Build MiloMultilang Android APK

on:
  workflow_dispatch:
    inputs:
      russian_only:
        description: 'Build only the Russian learner APK (MiloRussian.apk) and publish it as a release'
        type: boolean
        default: false
  push:
    branches:
      - main
      - arena/b2da2695-app1
      - arena/5fd5cd5d-app1
      - arena/9ecb1f7a-app2
      - arena/8366eeeb-app2
      - arena/8290df12-app2
      - arena/78e12bfa-app2
      - arena/b8803353-app2
      - arena/76386211-app2

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
      EXPO_PUBLIC_RUSSIAN_ONLY: ${{ ((github.event_name == 'workflow_dispatch' && inputs.russian_only) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[russian-apk]'))) && 'true' || 'false' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run TypeScript, SQL RLS, and 4-APK course validations
        run: |
          npm run typecheck
          npm run validate:admin
          npm run validate:admin-popups
          npm run validate:narrator
          npm run validate:turkish
          node scripts/verify-russian-course.cjs

      - name: Configure Expo project id for push notifications
        run: |
          EAS_PROJECT_ID="${EAS_PROJECT_ID:-af0dc4eb-5312-4157-ad1d-e1fd71aba769}"
          test -n "$EAS_PROJECT_ID"
          echo "EAS_PROJECT_ID=$EAS_PROJECT_ID" >> "$GITHUB_ENV"

      - name: Load and validate public Supabase app settings
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('config/supabase.public.json', 'utf8'));
          const url = String(config.EXPO_PUBLIC_SUPABASE_URL || '').trim();
          const key = String(config.EXPO_PUBLIC_SUPABASE_ANON_KEY || '').trim();
          let parsedUrl;
          try { parsedUrl = new URL(url); } catch {}
          if (!parsedUrl || parsedUrl.protocol !== 'https:' || parsedUrl.hostname.includes('example.com') || url.toLowerCase().includes('placeholder')) {
            throw new Error('Public Supabase app URL is missing or invalid.');
          }
          if (!key || key.toLowerCase().includes('placeholder') || key.includes('your-anon-key')) {
            throw new Error('Public Supabase app key is missing or invalid.');
          }
          if (key.startsWith('sb_secret_')) throw new Error('A secret Supabase key cannot be bundled in the app.');
          if (key.startsWith('eyJ')) {
            let payload;
            try { payload = JSON.parse(Buffer.from(key.split('.')[1], 'base64url').toString()); }
            catch { throw new Error('The public Supabase key is not a valid JWT.'); }
            if (payload.role !== 'anon') throw new Error('Only a public anon key may be bundled in the app.');
          }
          if (url.includes(String.fromCharCode(10)) || key.includes(String.fromCharCode(10))) {
            throw new Error('Supabase settings must be single-line values.');
          }
          fs.appendFileSync(process.env.GITHUB_ENV,
            `EXPO_PUBLIC_SUPABASE_URL=${url}\nEXPO_PUBLIC_SUPABASE_ANON_KEY=${key}\n`);
          NODE

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [[ ! -d "$SDK_ROOT" ]]; then
            echo "Android SDK directory was not found at $SDK_ROOT."
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [[ ! -d "$SDK_ROOT/platforms/android-36" || ! -d "$SDK_ROOT/build-tools/36.0.0" || ! -d "$SDK_ROOT/ndk/27.1.12297006" ]]; then
            if [[ -z "$SDKMANAGER" ]]; then
              echo "Android SDK 36 is missing and sdkmanager was not found."
              exit 1
            fi
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
            rm -f "$SDK_ROOT/.knownPackages" 2>/dev/null || true
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
          fi

      - name: Generate native Android project (App 2 — No-Login EN+RU)
        run: |
          rm -rf android /tmp/metro-* /tmp/haste-map-* node_modules/.cache
          EXPO_PUBLIC_APP_EDITION=en_ru npx expo prebuild --platform android --no-install

      - name: Build standalone release APK (App 2 — No-Login EN+RU)
        working-directory: android
        run: |
          chmod +x gradlew
          EXPO_PUBLIC_APP_EDITION=en_ru ./gradlew assembleRelease --no-daemon

      - name: Verify and preserve App 2 (2-MiloNoLogin-EN-RU.apk)
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          apk = 'android/app/build/outputs/apk/release/app-release.apk'
          with ZipFile(apk) as archive:
              names = set(archive.namelist())
          if 'AndroidManifest.xml' not in names or not any(name.endswith('classes.dex') for name in names):
              raise SystemExit('APK structure validation failed.')
          if 'assets/index.android.bundle' not in names:
              raise SystemExit('Standalone JS bundle is missing; refusing to publish an APK that needs Metro.')
          print('App 2 (No-Login EN+RU) APK verified.')
          PY
          cp android/app/build/outputs/apk/release/app-release.apk 2-MiloNoLogin-EN-RU.apk

      - name: Generate and build App 1 — Admin APK (1-MiloAdmin.apk)
        if: ${{ env.EXPO_PUBLIC_RUSSIAN_ONLY != 'true' }}
        shell: bash
        run: |
          rm -rf android /tmp/metro-* /tmp/haste-map-* node_modules/.cache
          MILO_ADMIN_APP=true EXPO_PUBLIC_MILO_ADMIN_APP=true EXPO_PUBLIC_ENABLE_EDUCATION_ADMIN=true npx expo prebuild --platform android --no-install
          cd android
          chmod +x gradlew
          MILO_ADMIN_APP=true EXPO_PUBLIC_MILO_ADMIN_APP=true EXPO_PUBLIC_ENABLE_EDUCATION_ADMIN=true ./gradlew assembleRelease --no-daemon
          cd ..
          cp android/app/build/outputs/apk/release/app-release.apk 1-MiloAdmin.apk
          python3 - <<'PY'
          from zipfile import ZipFile
          with ZipFile('1-MiloAdmin.apk') as archive:
              names = set(archive.namelist())
          if 'assets/index.android.bundle' not in names or not any(name.endswith('classes.dex') for name in names):
              raise SystemExit('Management APK structure validation failed.')
          print('App 1 (Admin) APK verified.')
          PY

      - name: Generate and build App 3 — No-Login All 4 Languages APK (3-MiloNoLogin-All4.apk)
        if: ${{ env.EXPO_PUBLIC_RUSSIAN_ONLY != 'true' }}
        shell: bash
        run: |
          rm -rf android /tmp/metro-* /tmp/haste-map-* node_modules/.cache
          EXPO_PUBLIC_APP_EDITION=all_four npx expo prebuild --platform android --no-install
          cd android
          chmod +x gradlew
          EXPO_PUBLIC_APP_EDITION=all_four ./gradlew assembleRelease --no-daemon
          cd ..
          cp android/app/build/outputs/apk/release/app-release.apk 3-MiloNoLogin-All4.apk
          python3 - <<'PY'
          from zipfile import ZipFile
          with ZipFile('3-MiloNoLogin-All4.apk') as archive:
              names = set(archive.namelist())
          if 'AndroidManifest.xml' not in names or 'assets/index.android.bundle' not in names or not any(name.endswith('classes.dex') for name in names):
              raise SystemExit('All-4-languages APK structure validation failed.')
          print('App 3 (No-Login All 4 Languages) APK verified.')
          PY

      - name: Generate and build App 4 — Login EN+DE+TR APK (4-MiloLogin-EN-DE-TR.apk)
        if: ${{ env.EXPO_PUBLIC_RUSSIAN_ONLY != 'true' }}
        shell: bash
        run: |
          rm -rf android /tmp/metro-* /tmp/haste-map-* node_modules/.cache
          EXPO_PUBLIC_APP_EDITION=login_en_de_tr EXPO_PUBLIC_LEARNER_LOGIN=true EXPO_PUBLIC_TURKISH_CLOUD_NARRATOR=true npx expo prebuild --platform android --no-install
          cd android
          chmod +x gradlew
          EXPO_PUBLIC_APP_EDITION=login_en_de_tr EXPO_PUBLIC_LEARNER_LOGIN=true EXPO_PUBLIC_TURKISH_CLOUD_NARRATOR=true ./gradlew assembleRelease --no-daemon
          cd ..
          cp android/app/build/outputs/apk/release/app-release.apk 4-MiloLogin-EN-DE-TR.apk
          python3 - <<'PY'
          from zipfile import ZipFile
          with ZipFile('4-MiloLogin-EN-DE-TR.apk') as archive:
              names = set(archive.namelist())
          if 'AndroidManifest.xml' not in names or 'assets/index.android.bundle' not in names or not any(name.endswith('classes.dex') for name in names):
              raise SystemExit('Login EN+DE+TR APK structure validation failed.')
          print('App 4 (Login EN+DE+TR, no Russian) APK verified.')
          PY

      - name: Smoke-test all 4 APKs on Android emulator
        if: ${{ env.EXPO_PUBLIC_RUSSIAN_ONLY != 'true' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          emulator-boot-timeout: 900
          disable-animations: true
          script: bash .github/scripts/android-emulator-smoke-test.sh

      - name: Upload Android emulator diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-smoke-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/milomultilang-emulator-smoke.log
            ${{ runner.temp }}/milomultilang-emulator-logcat.txt
            ${{ runner.temp }}/milomultilang-emulator-window.xml
            ${{ runner.temp }}/milomultilang-emulator-screen.png
          if-no-files-found: warn
          retention-days: 3

      - name: Confirm all 4 release APKs are ready
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[apk-release]') }}
        run: |
          if [ "${{ env.EXPO_PUBLIC_RUSSIAN_ONLY }}" != "true" ]; then
            test -s 1-MiloAdmin.apk
            test -s 2-MiloNoLogin-EN-RU.apk
            test -s 3-MiloNoLogin-All4.apk
            test -s 4-MiloLogin-EN-DE-TR.apk
          fi

      - name: Publish direct APK downloads (Ordered 1 to 4)
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[apk-release]') && env.EXPO_PUBLIC_RUSSIAN_ONLY != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: milomultilang-android-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: "Milo Android Suite #${{ github.run_number }} (Ordered 4-APK Release)"
          body: |
            مجموعهٔ رسمی و مرتب‌شدهٔ ۴ فایل نصبی اندروید (امضاشده و تست‌شده روی شبیه‌ساز اندروید):

            1. **1-MiloAdmin.apk** — اپ ادمین: مدیریت اختصاصی اپ با لاگین، فعال/غیرفعال‌سازی تک‌تک یا همهٔ زبان‌ها، ارسال پاپ‌آپ زنده (`com.devicecontrol.miloadmin`)
            2. **2-MiloNoLogin-EN-RU.apk** — اپ زبان‌آموز بدون لاگین: فقط انگلیسی و روسی (`com.devicecontrol.mml`)
            3. **3-MiloNoLogin-All4.apk** — اپ زبان‌آموز بدون لاگین: انگلیسی، آلمانی، روسی و ترکی استانبولی (`com.devicecontrol.miloall`)
            4. **4-MiloLogin-EN-DE-TR.apk** — اپ زبان‌آموز با لاگین: انگلیسی، آلمانی و ترکی استانبولی — بدون روسی (`com.devicecontrol.milomultilang`)
          prerelease: true
          files: |
            1-MiloAdmin.apk
            2-MiloNoLogin-EN-RU.apk
            3-MiloNoLogin-All4.apk
            4-MiloLogin-EN-DE-TR.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Name and publish the Russian-only APK
        if: ${{ env.EXPO_PUBLIC_RUSSIAN_ONLY == 'true' }}
        run: |
          cp 2-MiloNoLogin-EN-RU.apk MiloRussian.apk
          test -s MiloRussian.apk

      - name: Publish Russian-only APK release
        if: ${{ env.EXPO_PUBLIC_RUSSIAN_ONLY == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: milo-russian-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: "Milo Russian APK #${{ github.run_number }}"
          body: "Russian-only learner APK (Milo Russian). Sideload on Android."
          prerelease: true
          files: MiloRussian.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload Russian-only APK artifact
        if: ${{ env.EXPO_PUBLIC_RUSSIAN_ONLY == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: Milo-russian-apk
          path: MiloRussian.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload APK artifacts
        if: ${{ env.EXPO_PUBLIC_RUSSIAN_ONLY != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: Milo-android-apks
          path: |
            1-MiloAdmin.apk
            2-MiloNoLogin-EN-RU.apk
            3-MiloNoLogin-All4.apk
            4-MiloLogin-EN-DE-TR.apk
          if-no-files-found: error
          retention-days: 7
