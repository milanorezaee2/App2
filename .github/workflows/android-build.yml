name: Build MiloMultilang Android APK

on:
  workflow_dispatch:
    inputs:
      reuse_run:
        description: 'Re-test signed APK artifacts from this workflow run without rebuilding'
        type: string
        default: ''
      russian_only:
        description: 'Build only the Russian learner APK (MiloRussian.apk) and publish it as a release'
        type: boolean
        default: false
  push:
    branches:
      - main
      - arena/e354cbea-app2
      - arena/b2da2695-app1
      - arena/5fd5cd5d-app1
      - arena/9ecb1f7a-app2
      - arena/8366eeeb-app2
      - arena/8290df12-app2
      - arena/78e12bfa-app2
      - arena/b8803353-app2
      - arena/76386211-app2

permissions:
  contents: write
  actions: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-apk:
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.reuse_run == '') && !contains(github.event.head_commit.message, '[apk-verify-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
      EXPO_PUBLIC_RUSSIAN_ONLY: ${{ ((github.event_name == 'workflow_dispatch' && inputs.russian_only) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[russian-apk]'))) && 'true' || 'false' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run TypeScript, SQL RLS, and 4-APK course validations
        run: |
          npm run typecheck
          npm run validate:email-login
          npm run validate:google-login
          npm run validate:android-fonts
          npm run validate:admin
          npm run validate:admin-popups
          npm run validate:narrator
          npm run validate:turkish
          node scripts/verify-russian-course.cjs

      - name: Configure Expo project id for push notifications
        run: |
          EAS_PROJECT_ID="${EAS_PROJECT_ID:-af0dc4eb-5312-4157-ad1d-e1fd71aba769}"
          test -n "$EAS_PROJECT_ID"
          echo "EAS_PROJECT_ID=$EAS_PROJECT_ID" >> "$GITHUB_ENV"

      - name: Load and validate public Supabase app settings
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('config/supabase.public.json', 'utf8'));
          const url = String(config.EXPO_PUBLIC_SUPABASE_URL || '').trim();
          const key = String(config.EXPO_PUBLIC_SUPABASE_ANON_KEY || '').trim();
          let parsedUrl;
          try { parsedUrl = new URL(url); } catch {}
          if (!parsedUrl || parsedUrl.protocol !== 'https:' || parsedUrl.hostname.includes('example.com') || url.toLowerCase().includes('placeholder')) {
            throw new Error('Public Supabase app URL is missing or invalid.');
          }
          if (!key || key.toLowerCase().includes('placeholder') || key.includes('your-anon-key')) {
            throw new Error('Public Supabase app key is missing or invalid.');
          }
          if (key.startsWith('sb_secret_')) throw new Error('A secret Supabase key cannot be bundled in the app.');
          if (key.startsWith('eyJ')) {
            let payload;
            try { payload = JSON.parse(Buffer.from(key.split('.')[1], 'base64url').toString()); }
            catch { throw new Error('The public Supabase key is not a valid JWT.'); }
            if (payload.role !== 'anon') throw new Error('Only a public anon key may be bundled in the app.');
          }
          if (url.includes(String.fromCharCode(10)) || key.includes(String.fromCharCode(10))) {
            throw new Error('Supabase settings must be single-line values.');
          }
          fs.appendFileSync(process.env.GITHUB_ENV,
            `EXPO_PUBLIC_SUPABASE_URL=${url}\nEXPO_PUBLIC_SUPABASE_ANON_KEY=${key}\nEXPO_PUBLIC_NARRATOR_CLOUD=on\nANDROID_VERSION_CODE=${200 + Number(process.env.GITHUB_RUN_NUMBER || 1)}\n`);
          NODE

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [[ ! -d "$SDK_ROOT" ]]; then
            echo "Android SDK directory was not found at $SDK_ROOT."
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [[ ! -d "$SDK_ROOT/platforms/android-36" || ! -d "$SDK_ROOT/build-tools/36.0.0" || ! -d "$SDK_ROOT/ndk/27.1.12297006" ]]; then
            if [[ -z "$SDKMANAGER" ]]; then
              echo "Android SDK 36 is missing and sdkmanager was not found."
              exit 1
            fi
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
            rm -f "$SDK_ROOT/.knownPackages" 2>/dev/null || true
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
          fi

      - name: Generate native Android project (App 2 — No-Login EN+RU)
        run: |
          rm -rf android .expo /tmp/metro-* /tmp/haste-map-* "${RUNNER_TEMP:-/tmp}"/metro-* "${RUNNER_TEMP:-/tmp}"/haste-map-* node_modules/.cache node_modules/expo-constants/android/build
          EXPO_PUBLIC_APP_EDITION=en_ru npx expo prebuild --platform android --no-install

      - name: Build standalone release APK (App 2 — No-Login EN+RU)
        working-directory: android
        run: |
          chmod +x gradlew
          EXPO_PUBLIC_APP_EDITION=en_ru ./gradlew assembleRelease --no-daemon

      - name: Verify and preserve App 2 (2-MiloNoLogin-EN-RU.apk)
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk 2-MiloNoLogin-EN-RU.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" sign \
            --ks android/app/debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            2-MiloNoLogin-EN-RU.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose 2-MiloNoLogin-EN-RU.apk
          python3 - <<'PY'
          import json
          from zipfile import ZipFile
          with ZipFile('2-MiloNoLogin-EN-RU.apk') as archive:
              names = set(archive.namelist())
              cfg = json.loads(archive.read('assets/app.config').decode('utf-8'))
          if 'AndroidManifest.xml' not in names or not any(name.endswith('classes.dex') for name in names):
              raise SystemExit('APK structure validation failed.')
          if 'assets/index.android.bundle' not in names:
              raise SystemExit('Standalone JS bundle is missing; refusing to publish an APK that needs Metro.')
          extra = cfg.get('extra') or {}
          assert cfg.get('android', {}).get('package') == 'com.devicecontrol.mml.v2', cfg
          assert int(cfg.get('android', {}).get('versionCode', 0)) >= 200, cfg
          assert extra.get('edition') == 'en_ru' and extra.get('learnerLogin') is False, extra
          assert extra.get('englishCourse') is True and extra.get('russianCourse') is True, extra
          assert extra.get('germanCourse') is False and extra.get('turkishCourse') is False, extra
          assert not extra.get('turkishCloudNarrator'), extra
          print('App 2 (No-Login EN+RU) APK verified:', cfg['android']['package'], cfg['android']['versionCode'])
          PY

      - name: Generate and build App 1 — Admin APK (1-MiloAdmin.apk)
        if: ${{ env.EXPO_PUBLIC_RUSSIAN_ONLY != 'true' }}
        shell: bash
        run: |
          rm -rf android .expo /tmp/metro-* /tmp/haste-map-* "${RUNNER_TEMP:-/tmp}"/metro-* "${RUNNER_TEMP:-/tmp}"/haste-map-* node_modules/.cache node_modules/expo-constants/android/build
          MILO_ADMIN_APP=true EXPO_PUBLIC_MILO_ADMIN_APP=true EXPO_PUBLIC_ENABLE_EDUCATION_ADMIN=true npx expo prebuild --platform android --no-install
          cd android
          chmod +x gradlew
          MILO_ADMIN_APP=true EXPO_PUBLIC_MILO_ADMIN_APP=true EXPO_PUBLIC_ENABLE_EDUCATION_ADMIN=true ./gradlew assembleRelease --no-daemon
          cd ..
          cp android/app/build/outputs/apk/release/app-release.apk 1-MiloAdmin.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" sign \
            --ks android/app/debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            1-MiloAdmin.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose 1-MiloAdmin.apk
          python3 - <<'PY'
          import json
          from zipfile import ZipFile
          with ZipFile('1-MiloAdmin.apk') as archive:
              names = set(archive.namelist())
              cfg = json.loads(archive.read('assets/app.config').decode('utf-8'))
          if 'assets/index.android.bundle' not in names or not any(name.endswith('classes.dex') for name in names):
              raise SystemExit('Management APK structure validation failed.')
          extra = cfg.get('extra') or {}
          assert cfg.get('android', {}).get('package') == 'com.devicecontrol.miloadmin.v2', cfg
          assert int(cfg.get('android', {}).get('versionCode', 0)) >= 200, cfg
          assert extra.get('appRole') == 'admin' and extra.get('edition') == 'admin', extra
          print('App 1 (Admin) APK verified:', cfg['android']['package'], cfg['android']['versionCode'])
          PY

      - name: Generate and build App 3 — No-Login All 4 Languages APK (3-MiloNoLogin-All4.apk)
        if: ${{ env.EXPO_PUBLIC_RUSSIAN_ONLY != 'true' }}
        shell: bash
        run: |
          rm -rf android .expo /tmp/metro-* /tmp/haste-map-* "${RUNNER_TEMP:-/tmp}"/metro-* "${RUNNER_TEMP:-/tmp}"/haste-map-* node_modules/.cache node_modules/expo-constants/android/build
          EXPO_PUBLIC_APP_EDITION=all_four npx expo prebuild --platform android --no-install
          cd android
          chmod +x gradlew
          EXPO_PUBLIC_APP_EDITION=all_four ./gradlew assembleRelease --no-daemon
          cd ..
          cp android/app/build/outputs/apk/release/app-release.apk 3-MiloNoLogin-All4.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" sign \
            --ks android/app/debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            3-MiloNoLogin-All4.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose 3-MiloNoLogin-All4.apk
          python3 - <<'PY'
          import json
          from zipfile import ZipFile
          with ZipFile('3-MiloNoLogin-All4.apk') as archive:
              names = set(archive.namelist())
              cfg = json.loads(archive.read('assets/app.config').decode('utf-8'))
          if 'AndroidManifest.xml' not in names or 'assets/index.android.bundle' not in names or not any(name.endswith('classes.dex') for name in names):
              raise SystemExit('All-4-languages APK structure validation failed.')
          extra = cfg.get('extra') or {}
          assert cfg.get('android', {}).get('package') == 'com.devicecontrol.miloall.v2', cfg
          assert int(cfg.get('android', {}).get('versionCode', 0)) >= 200, cfg
          assert extra.get('edition') == 'all_four' and extra.get('learnerLogin') is False, extra
          assert extra.get('englishCourse') is True and extra.get('germanCourse') is True and extra.get('russianCourse') is True and extra.get('turkishCourse') is True, extra
          assert not extra.get('turkishCloudNarrator'), extra
          print('App 3 (No-Login All 4 Languages) APK verified:', cfg['android']['package'], cfg['android']['versionCode'])
          PY

      - name: Generate and build App 4 — Login EN+DE+TR APK (4-MiloLogin-EN-DE-TR.apk)
        if: ${{ env.EXPO_PUBLIC_RUSSIAN_ONLY != 'true' }}
        shell: bash
        run: |
          rm -rf android .expo /tmp/metro-* /tmp/haste-map-* "${RUNNER_TEMP:-/tmp}"/metro-* "${RUNNER_TEMP:-/tmp}"/haste-map-* node_modules/.cache node_modules/expo-constants/android/build
          EXPO_PUBLIC_APP_EDITION=login_en_de_tr EXPO_PUBLIC_LEARNER_LOGIN=true EXPO_PUBLIC_TURKISH_CLOUD_NARRATOR=true npx expo prebuild --platform android --no-install
          cd android
          chmod +x gradlew
          EXPO_PUBLIC_APP_EDITION=login_en_de_tr EXPO_PUBLIC_LEARNER_LOGIN=true EXPO_PUBLIC_TURKISH_CLOUD_NARRATOR=true ./gradlew assembleRelease --no-daemon
          cd ..
          cp android/app/build/outputs/apk/release/app-release.apk 4-MiloLogin-EN-DE-TR.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" sign \
            --ks android/app/debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            4-MiloLogin-EN-DE-TR.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose 4-MiloLogin-EN-DE-TR.apk
          python3 - <<'PY'
          import json
          from zipfile import ZipFile
          with ZipFile('4-MiloLogin-EN-DE-TR.apk') as archive:
              names = set(archive.namelist())
              cfg = json.loads(archive.read('assets/app.config').decode('utf-8'))
          if 'AndroidManifest.xml' not in names or 'assets/index.android.bundle' not in names or not any(name.endswith('classes.dex') for name in names):
              raise SystemExit('Login EN+DE+TR APK structure validation failed.')
          extra = cfg.get('extra') or {}
          assert cfg.get('android', {}).get('package') == 'com.devicecontrol.milomultilang.v2', cfg
          assert int(cfg.get('android', {}).get('versionCode', 0)) >= 200, cfg
          assert extra.get('edition') == 'login_en_de_tr' and extra.get('learnerLogin') is True, extra
          assert extra.get('englishCourse') is True and extra.get('germanCourse') is True and extra.get('turkishCourse') is True, extra
          assert extra.get('russianCourse') is False, extra
          assert extra.get('turkishCloudNarrator') is True, extra
          print('App 4 (Login EN+DE+TR + Turkish Narrator) APK verified:', cfg['android']['package'], cfg['android']['versionCode'])
          PY

      - name: Enable hardware acceleration for reliable emulator input
        if: ${{ env.EXPO_PUBLIC_RUSSIAN_ONLY != 'true' }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm

      - name: Smoke-test all 4 APKs on Android emulator
        if: ${{ env.EXPO_PUBLIC_RUSSIAN_ONLY != 'true' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          emulator-boot-timeout: 900
          disable-animations: true
          script: bash .github/scripts/android-emulator-smoke-test.sh

      - name: Upload Android emulator diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-smoke-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/milomultilang-emulator-smoke.log
            ${{ runner.temp }}/milomultilang-emulator-logcat.txt
            ${{ runner.temp }}/milomultilang-emulator-window.xml
            ${{ runner.temp }}/milomultilang-emulator-screen.png
            ${{ runner.temp }}/milomultilang-language-choices.xml.log
          if-no-files-found: warn
          retention-days: 3

      - name: Confirm all 4 release APKs are ready
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[apk-release]') }}
        run: |
          if [ "${{ env.EXPO_PUBLIC_RUSSIAN_ONLY }}" != "true" ]; then
            test -s 1-MiloAdmin.apk
            test -s 2-MiloNoLogin-EN-RU.apk
            test -s 3-MiloNoLogin-All4.apk
            test -s 4-MiloLogin-EN-DE-TR.apk
          fi

      - name: Publish direct APK downloads (Ordered 1 to 4)
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[apk-release]') && env.EXPO_PUBLIC_RUSSIAN_ONLY != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: milomultilang-android-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: "Milo Android Suite #${{ github.run_number }} (Clean v2.0 — Ordered 4-APK Release)"
          body: |
            مجموعهٔ به‌روز ۴ فایل نصبی اندروید با شناسه‌های جداگانهٔ `.v2`؛ ساخت، امضا و تست نصب و بازشدن در شبیه‌ساز Android بررسی شده است. این بررسی‌ها تضمین نبودن باگ روی همهٔ گوشی‌ها نیست.

            1. **1-MiloAdmin.apk** (`1-MiloAdmin` / `com.devicecontrol.miloadmin.v2`) — اپ ادمین: مدیریت اختصاصی اپ با لاگین، فعال/غیرفعال‌سازی تک‌تک یا همهٔ زبان‌ها، ارسال پاپ‌آپ زنده
            2. **2-MiloNoLogin-EN-RU.apk** (`2-Milo EN-RU` / `com.devicecontrol.mml.v2`) — اپ زبان‌آموز بدون لاگین: فقط انگلیسی و روسی
            3. **3-MiloNoLogin-All4.apk** (`3-Milo All4` / `com.devicecontrol.miloall.v2`) — اپ زبان‌آموز بدون لاگین: انگلیسی، آلمانی، روسی و ترکی استانبولی
            4. **4-MiloLogin-EN-DE-TR.apk** (`4-Milo Login` / `com.devicecontrol.milomultilang.v2`) — اپ زبان‌آموز با لاگین: انگلیسی، آلمانی و ترکی استانبولی + نریتور اتوماتیک ترکی استانبولی (بدون روسی)

            تغییرات این نسخه: هیروی جمع‌وجور و تصویر جدید، کارت‌های خوانای زبان با نام کامل ترکی استانبولی و دکمهٔ ورود Google در نسخهٔ با لاگین؛ ورود با کد ایمیلی حفظ شده است.

            نکته: ورود واقعی Google نیاز به فعال‌سازی ارائه‌دهنده در Supabase و تنظیم OAuth در Google Cloud دارد؛ نمایش دکمه به‌معنی تکمیل تنظیمات سرویس نیست.
          prerelease: false
          make_latest: true
          files: |
            1-MiloAdmin.apk
            2-MiloNoLogin-EN-RU.apk
            3-MiloNoLogin-All4.apk
            4-MiloLogin-EN-DE-TR.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Name and publish the Russian-only APK
        if: ${{ env.EXPO_PUBLIC_RUSSIAN_ONLY == 'true' }}
        run: |
          cp 2-MiloNoLogin-EN-RU.apk MiloRussian.apk
          test -s MiloRussian.apk

      - name: Publish Russian-only APK release
        if: ${{ env.EXPO_PUBLIC_RUSSIAN_ONLY == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: milo-russian-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: "Milo Russian APK #${{ github.run_number }}"
          body: "Russian-only learner APK (Milo Russian). Sideload on Android."
          prerelease: true
          files: MiloRussian.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload Russian-only APK artifact
        if: ${{ env.EXPO_PUBLIC_RUSSIAN_ONLY == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: Milo-russian-apk
          path: MiloRussian.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload APK artifacts
        if: ${{ always() && env.EXPO_PUBLIC_RUSSIAN_ONLY != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: Milo-android-apks
          path: |
            1-MiloAdmin.apk
            2-MiloNoLogin-EN-RU.apk
            3-MiloNoLogin-All4.apk
            4-MiloLogin-EN-DE-TR.apk
          if-no-files-found: error
          retention-days: 7

  verify-existing-apks:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.reuse_run != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: ${{ inputs.reuse_run }}
    steps:
      - uses: actions/checkout@v5
      - name: Validate source build and record provenance
        shell: bash
        run: |
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > source-run.json
          python3 - <<'PYPROVENANCE'
          import json, os
          run = json.load(open('source-run.json'))
          assert run['path'] == '.github/workflows/android-build.yml', run['path']
          assert run['head_branch'] == os.environ['GITHUB_REF_NAME'], run['head_branch']
          assert run['status'] == 'completed', run['status']
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('SOURCE_SHA=' + run['head_sha'] + '\n')
              env.write('SOURCE_NUMBER=' + str(run['run_number']) + '\n')
          PYPROVENANCE
      - name: Download original signed APKs
        uses: actions/download-artifact@v4
        with:
          name: Milo-android-apks
          github-token: ${{ github.token }}
          run-id: ${{ inputs.reuse_run }}
      - name: Verify all four APK signatures and identities again
        shell: bash
        run: |
          SIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$SIGNER"
          for apk in 1-MiloAdmin.apk 2-MiloNoLogin-EN-RU.apk 3-MiloNoLogin-All4.apk 4-MiloLogin-EN-DE-TR.apk; do
            "$SIGNER" verify --verbose "$apk"
          done
          python3 - <<'PYVERIFY'
          import json
          from zipfile import ZipFile
          expected = [
            ('1-MiloAdmin.apk','com.devicecontrol.miloadmin.v2','admin',None),
            ('2-MiloNoLogin-EN-RU.apk','com.devicecontrol.mml.v2','en_ru',False),
            ('3-MiloNoLogin-All4.apk','com.devicecontrol.miloall.v2','all_four',False),
            ('4-MiloLogin-EN-DE-TR.apk','com.devicecontrol.milomultilang.v2','login_en_de_tr',True),
          ]
          for name, package, edition, login in expected:
              with ZipFile(name) as apk:
                  assert apk.testzip() is None, name
                  names = apk.namelist()
                  assert 'AndroidManifest.xml' in names and 'assets/index.android.bundle' in names, name
                  assert any(n.endswith('classes.dex') for n in names), name
                  config = json.loads(apk.read('assets/app.config'))
              assert config['android']['package'] == package, name
              assert config['android']['versionCode'] >= 200, name
              assert config['extra']['edition'] == edition, name
              if login is not None: assert config['extra']['learnerLogin'] is login, name
              else: assert config['extra']['appRole'] == 'admin', name
              print('Verified original signed APK:', name, config['android']['versionCode'])
          PYVERIFY
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Re-test all four signed APKs on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          emulator-boot-timeout: 900
          disable-animations: true
          script: bash .github/scripts/android-emulator-smoke-test.sh
      - name: Upload retest diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-retest-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/milomultilang-emulator-*
            ${{ runner.temp }}/milomultilang-language-choices.xml.log
          if-no-files-found: warn
          retention-days: 3
      - name: Publish only after the emulator retest succeeds
        shell: bash
        run: |
          gh release create "milomultilang-android-$SOURCE_NUMBER" \
            --target "$SOURCE_SHA" \
            --title "Milo Android Suite #$SOURCE_NUMBER — Updated UI and Google button" \
            --notes "Four original signed APKs from source run $SOURCE_RUN ($SOURCE_SHA), successfully reverified and smoke-tested on Android in run $GITHUB_RUN_ID. Includes the updated compact hero, full Turkish language card title and Google sign-in button. Google login still requires server-side OAuth provider setup; email OTP remains available." \
            1-MiloAdmin.apk 2-MiloNoLogin-EN-RU.apk 3-MiloNoLogin-All4.apk 4-MiloLogin-EN-DE-TR.apk
